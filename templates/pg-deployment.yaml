{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdb.pgName" . }}
  labels:
    app: pg
spec:
  replicas: {{ .Values.database.replicaCount }}
  selector:
    matchLabels:
      app: pg
  template:
    metadata:
      labels:
        app: pg
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cdb.pgConfigName" . }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "cdb.pgCredentialsName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cdb.pgCredentialsName" . }}
                  key: password
            - name: PGDATA
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cdb.pgConfigName" . }}
                  key: db_path
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: "1"
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: {{ include "cdb.pgPvcName" . }}
{{- end }}
