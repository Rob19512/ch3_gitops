{{- if .Values.database.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cdb.pgPvcName" . }}
spec:
  storageClassName: {{ .Values.database.storageClassName }}
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: {{ .Values.database.storage }}
{{- end }}
